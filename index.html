<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<title>Invocation</title>
<style>
/* ============ BASE ============ */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
html, body { margin:0; height:100%; background:#000; color:#e9dfff;
    font-family:Georgia, "Times New Roman", serif; overflow:hidden;
    touch-action:manipulation; overscroll-behavior:none; }

/* ============ SCENE UNIQUE : toutes les videos sont empilees plein ecran ============ */
#stage { position:fixed; inset:0; background:#000; }
#stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; pointer-events:none; background:#000; }
#stage video.show { opacity:1; }

/* Placeholder : s'affiche si un fichier video est introuvable (permet de tester sans assets) */
#ph { position:absolute; inset:6vmin; z-index:5; display:none; align-items:center; justify-content:center;
    text-align:center; font-size:3vmin; line-height:1.5; color:#8f78bd; white-space:pre-line;
    border:.5vmin dashed #4b3875; border-radius:3vmin; pointer-events:none; }
#ph.on { display:flex; }

/* Bouton REJOUER : style craie / rune, noir, lueur rouge (coherent avec le cercle d'invocation).
   Police : depose un fichier assets/fonts/invocation.woff2 pour utiliser la tienne, sinon police monospace. */
@font-face { font-family:'Invocation'; src:url('assets/fonts/invocation.woff2') format('woff2'); font-display:swap; }
#replay { position:absolute; z-index:10; left:50%; bottom:4vmin; transform:translateX(-50%);
    display:none; cursor:pointer;
    font-family:'Invocation', ui-monospace, 'SF Mono', Menlo, 'Courier New', monospace;
    font-size:3.4vmin; font-weight:700; letter-spacing:.3em; text-transform:uppercase; padding:1.8vmin 6vmin;
    color:#f2f2f2; background:rgba(0,0,0,.82);
    border:.45vmin solid #e8e8e8; border-radius:255px 18px 225px 18px / 18px 225px 18px 255px;
    text-shadow:0 0 1.2vmin #d11;
    box-shadow:0 0 2.5vmin rgba(200,0,0,.45), inset 0 0 1.5vmin rgba(255,255,255,.12); }
#replay.on { display:block; }
#replay:disabled { opacity:.45; border-color:#8a8a8a; box-shadow:none; text-shadow:none; }
#replay:active:not(:disabled) { background:#7d0d0d; border-color:#ff9a1a; color:#fff; }
/* Mode image : actif automatiquement si assets/button.png est chargée */
#replayImg { display:none; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; }
#replay.img { width:min(40vmin, 60vw); padding:0; border:0; border-radius:0; background:none;
    box-shadow:none; text-shadow:none; }
#replay.img #replayTxt { display:none; }
#replay.img #replayImg { display:block; }
#replay.img:disabled { opacity:.4; }
#replay.img:active:not(:disabled) { background:none; filter:brightness(1.4); }

/* ============ ADMIN CACHE ============ */
#hotspot { position:fixed; top:0; right:0; width:110px; height:110px; z-index:50; }
#admin { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(5,3,10,.94); }
#admin.open { display:flex; }
#admin .box { width:min(520px, 92vw); font-family:system-ui, sans-serif; font-size:20px; }
#admin table { width:100%; border-collapse:collapse; margin:16px 0; }
#admin td, #admin th { padding:10px 8px; border-bottom:1px solid #3a2d58; text-align:right; }
#admin td:first-child, #admin th:first-child { text-align:left; }
#admin button { font:inherit; padding:12px 20px; margin-right:10px; border-radius:10px;
    color:#e9dfff; background:#3a1f66; border:1px solid #8f78bd; }
</style>
</head>
<body>

<div id="stage">
  <div id="ph"></div>
  <button id="replay"><span id="replayTxt">REJOUER</span><img id="replayImg" alt="REJOUER" draggable="false"></button>
</div>

<!-- Admin : triple tap dans le coin haut droit -->
<div id="hotspot"></div>
<div id="admin"><div class="box">
  <strong>Compteur de tirages</strong>
  <table id="statsTable"></table>
  <button id="adminClose">Fermer</button>
  <button id="adminReset">Remise à zéro</button>
</div></div>

<script>
/* =====================================================================
   CONFIGURATION
   ===================================================================== */
const CONFIG = {
  CLIP_DIR: 'assets/clips/',                  // dossier des videos de steps
  WAITING_VIDEO: 'assets/clips/WAITING.mp4',  // ecran d'attente (boucle) : A ADAPTER au vrai nom de fichier
  TOTAL_STEPS: 5,                             // nombre de clics / bougies
  REPLAY_LOCK_MS: 2000,                       // anti-misclick du bouton REJOUER
  IDLE_RESET_MS: 30000,                       // retour a l'attente si abandon en cours de route
  PLACEHOLDER_STEP_MS: 1500,                  // duree d'un step "fantome" quand la video manque
  PRELOAD_IN_MEMORY: true,                    // charge chaque video en mémoire avant lecture (évite les saccades)
  REPLAY_IMG: 'assets/button.png',            // image du bouton REJOUER (optionnelle, remplace le style CSS)
  SHOW_ERRORS: true,                          // true = affiche un message si une video échoue (test). false pour l'événement
  SOUND: false,                               // true = joue le son des steps (a tester sur l'iPad)
  FORCE_RARITY: null                          // TEST : 'common', 'rare', 'epic', 'legendary' ou 'fail' force une rareté. null = vrai tirage
};

/* Raretes : weight = pourcentage (somme = 100) */
const RARITIES = [
  { id:'common',    label:'COMMUN',           weight:63 },
  { id:'rare',      label:'RARE',             weight:25 },
  { id:'epic',      label:'ÉPIQUE',           weight:8  },
  { id:'legendary', label:'LÉGENDAIRE',       weight:2  },
  { id:'fail',      label:'INVOCATION RATÉE', weight:2  }
];

/* Prefixe de fichier utilise a chaque clic, selon la rareté tirée.
   Fichiers lus dans assets/clips/ : <PREFIXE>_STEP_<n>.mp4 puis <PREFIXE>_STEP_<n>_LOOP.mp4 */
const STEP_PLAN = {
  common:    ['DEMON_MINEUR','DEMON_MINEUR','DEMON_MINEUR','DEMON_MINEUR','DEMON_MINEUR'],
  rare:      ['DEMON_MINEUR','DEMON_MAJEUR','DEMON_MAJEUR','DEMON_MAJEUR','DEMON_MAJEUR'],
  epic:      ['DEMON_MINEUR','DEMON_MAJEUR','ARCHIDEMON','ARCHIDEMON','ARCHIDEMON'],
  legendary: ['DEMON_MINEUR','DEMON_MAJEUR','ARCHIDEMON','DEMON_ANCIEN','DEMON_ANCIEN'],
  fail:      ['DEMON_MINEUR','DEMON_MINEUR','DEMON_MINEUR','DEMON_MINEUR','DEMON_FLOPESQUE']
};

/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = id => document.getElementById(id);
const stage = $('stage'), ph = $('ph'), replayBtn = $('replay'), replayTxt = $('replayTxt'), replayImg = $('replayImg');

// Aléatoire uniforme [0,1)
function rand() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }

// Tirage pondéré
function drawRarity() {
  if (CONFIG.FORCE_RARITY) return RARITIES.find(r => r.id === CONFIG.FORCE_RARITY) || RARITIES[0];
  const total = RARITIES.reduce((s, r) => s + r.weight, 0);
  let x = rand() * total, acc = 0;
  for (const r of RARITIES) { acc += r.weight; if (x < acc) return r; }
  return RARITIES[RARITIES.length - 1];
}

/* =====================================================================
   STATISTIQUES (localStorage, repli en mémoire si indisponible)
   ===================================================================== */
const KEY = 'invocation_stats_v1';
let stats = {};
try { stats = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
RARITIES.forEach(r => { stats[r.id] = stats[r.id] || 0; });
const saveStats = () => { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} };

/* =====================================================================
   VIDEOS
   ===================================================================== */
let current = null;   // video actuellement affichée

function makeVideo(loop, forceMuted) {
  const v = document.createElement('video');
  v.muted = forceMuted || !CONFIG.SOUND; v.loop = loop; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
  v.disablePictureInPicture = true;
  stage.appendChild(v);
  return v;
}
function killVideo(v) {
  v._dead = true; try { v.pause(); } catch (e) {}
  v.removeAttribute('src'); v.load(); v.remove();
  if (v._blobUrl) { URL.revokeObjectURL(v._blobUrl); v._blobUrl = null; }
}

/* Charge le fichier entier en mémoire puis le donne à la balise video : lecture immédiate, sans réseau.
   En cas d'échec, repli sur l'adresse directe (le diagnostic d'erreur s'affichera alors). */
function loadSrc(v, url) {
  v._origUrl = url;
  if (!CONFIG.PRELOAD_IN_MEMORY) { v.src = url; return Promise.resolve(); }
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error('http'); return r.blob(); })
    .then(b => { if (v._dead) return; v._blobUrl = URL.createObjectURL(new Blob([b], { type: 'video/mp4' })); v.src = v._blobUrl; })
    .catch(() => { if (!v._dead) v.src = url; });
}

/* Joue une video. L'ancienne reste affichée jusqu'à ce que la nouvelle tourne (pas de flash noir).
   done = appelé à la fin (videos sans loop). Si le fichier manque : placeholder temporisé. */
function playClip(v, label, done, valid) {
  let finished = false, shown = false, wd = null;

  const watch = () => { if (!shown && !finished) fail('délai de chargement dépassé'); };

  const fail = why => {
    if (finished || v._dead) return;
    // 1er échec avec une video en mémoire : on retente avec l'adresse directe du fichier
    if (!v._retried && v._blobUrl) {
      v._retried = true; clearTimeout(wd);
      URL.revokeObjectURL(v._blobUrl); v._blobUrl = null;
      v.src = v._origUrl; v.load();
      wd = setTimeout(watch, 12000);
      start();
      return;
    }
    finished = true; clearTimeout(wd);
    if (!CONFIG.SHOW_ERRORS) {                      // mode événement : on garde la dernière image, on avance
      if (done) setTimeout(done, CONFIG.PLACEHOLDER_STEP_MS);
      return;
    }
    if (current) current.classList.remove('show');
    const code = v.error ? ' (code ' + v.error.code + ')' : '';
    const url = v._origUrl || v.currentSrc || v.src;
    ph.textContent = 'VIDEO NON LUE\n' + label + '\n' + url + '\n' + (why || 'erreur de lecture') + code;
    ph.classList.add('on');
    fetch(url, { method: 'HEAD' }).then(r => {
      ph.textContent += r.ok ? '\n\nFichier présent (HTTP ' + r.status + ')'
                             : '\n\nFichier INTROUVABLE (HTTP ' + r.status + ') : nom, majuscules ou dossier ?';
    }).catch(() => { ph.textContent += '\n\nTest impossible (ouvre l\'app en http, pas en fichier local)'; });
    if (done) setTimeout(done, CONFIG.PLACEHOLDER_STEP_MS);
  };

  const start = () => {
    if (v._dead || finished) return;
    if (v.error) return fail('erreur de lecture');
    // Affiche cette video et masque la précédente. Déclenché par 'playing' OU par la résolution de play() :
    // sur iPad, 'playing' ne se déclenche pas toujours sur une video déjà lancée.
    let revealed = false;
    const reveal = () => {
      if (revealed || v._dead || finished) return; revealed = true;
      // valid() faux = un autre step a déjà démarré entre-temps : on n'affiche pas cette video
      if (valid && !valid()) { finished = true; clearTimeout(wd); v.pause(); return; }
      shown = true; clearTimeout(wd);
      ph.classList.remove('on'); v.classList.add('show');
      const prev = current;
      if (prev && prev !== v) { prev.classList.remove('show'); try { prev.pause(); } catch (e) {} }
      current = v;
    };
    v.addEventListener('playing', reveal, { once: true });
    v.addEventListener('error', () => fail('erreur de lecture'), { once: true });
    if (done) v.addEventListener('ended', () => { if (!finished) { finished = true; clearTimeout(wd); done(); } }, { once: true });
    try { v.pause(); v.currentTime = 0; } catch (e) {}   // pause d'abord : garantit un vrai redémarrage
    const p = v.play(); if (p && p.then) p.then(reveal, () => {});
  };

  wd = setTimeout(watch, 12000);
  (v._ready || Promise.resolve()).then(start);
}

/* =====================================================================
   ETAT DU JEU
   phase : 'wait' (ecran d'attente) > 'step' (clip en cours) > 'hold' (flamme en boucle, attend le clic)
           > 'result' (carte affichée, bouton REJOUER)
   ===================================================================== */
let phase = 'wait', lit = 0, pick = null, plan = null, idleTimer = null;
const clips = {};                // videos du tirage en cours, clés '1', '1L', '2'...
const clipFile = (n, loop) => plan[n - 1] + '_STEP_' + n + (loop ? '_LOOP' : '') + '.mp4';

// Cree (une seule fois) la video du step n, ou de sa boucle
function clip(n, loop) {
  const k = n + (loop ? 'L' : '');
  if (!clips[k]) { const v = makeVideo(loop); v._ready = loadSrc(v, CONFIG.CLIP_DIR + clipFile(n, loop)); clips[k] = v; }
  return clips[k];
}
// Libère les videos des steps <= n (économise la mémoire de l'iPad)
function dispose(n) {
  Object.keys(clips).forEach(k => { if (parseInt(k, 10) <= n) { killVideo(clips[k]); delete clips[k]; } });
}

const waitVid = makeVideo(true, true);   // toujours muet (autoplay avant le 1er toucher)
waitVid._ready = loadSrc(waitVid, CONFIG.WAITING_VIDEO);

function resetIdle() {
  clearTimeout(idleTimer);
  if (phase === 'hold') idleTimer = setTimeout(resetGame, CONFIG.IDLE_RESET_MS);
}

/* Retour à l'écran d'attente : la rareté est tirée ICI, avant le 1er clic, pour précharger les bonnes videos */
function resetGame() {
  clearTimeout(idleTimer);
  dispose(99);
  lit = 0; phase = 'wait';
  replayBtn.classList.remove('on');
  pick = drawRarity(); plan = STEP_PLAN[pick.id];
  for (let i = 1; i <= CONFIG.TOTAL_STEPS; i++) { clip(i, false); clip(i, true); }   // précharge tout le tirage pendant l'attente
  playClip(waitVid, 'ECRAN D\'ATTENTE\n' + CONFIG.WAITING_VIDEO + '\n\nTouche pour commencer', null, () => phase === 'wait');
}

/* Touche : lance le step suivant */
stage.addEventListener('pointerdown', e => {
  if (replayBtn.contains(e.target)) return;
  if (phase !== 'wait' && phase !== 'hold') return;   // pendant un clip, on ignore les touches
  nextStep();
});

function nextStep() {
  clearTimeout(idleTimer);
  lit++; phase = 'step';
  const n = lit;
  if (n < CONFIG.TOTAL_STEPS) { clip(n + 1, false); }  // précharge le step suivant
  clip(n, true);                                       // et la boucle de celui-ci
  playClip(clip(n, false), clipFile(n, false), () => stepDone(n));
}

function stepDone(n) {
  playClip(clip(n, true), clipFile(n, true), null, () => lit === n);          // la flamme/carte continue en boucle
  setTimeout(() => dispose(n - 1), 600);               // libère les videos précédentes
  if (n >= CONFIG.TOTAL_STEPS) showResult();
  else { phase = 'hold'; resetIdle(); }
}

/* Derniere boucle affichée (= la carte) : compte le tirage et propose REJOUER */
function showResult() {
  phase = 'result';
  stats[pick.id]++; saveStats();
  replayBtn.classList.add('on'); replayBtn.disabled = true;
  let left = Math.ceil(CONFIG.REPLAY_LOCK_MS / 1000);
  replayTxt.textContent = 'REJOUER (' + left + ')';
  const t = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(t); replayBtn.disabled = false; replayTxt.textContent = 'REJOUER'; }
    else replayTxt.textContent = 'REJOUER (' + left + ')';
  }, 1000);
}
replayBtn.addEventListener('click', () => { if (!replayBtn.disabled) resetGame(); });

/* =====================================================================
   ADMIN CACHE : triple tap dans le coin haut droit
   ===================================================================== */
let adminTaps = [];
$('hotspot').addEventListener('pointerdown', () => {
  const n = Date.now();
  adminTaps = adminTaps.filter(t => n - t < 900); adminTaps.push(n);
  if (adminTaps.length >= 3) { adminTaps = []; openAdmin(); }
});
function openAdmin() {
  const total = RARITIES.reduce((s, r) => s + stats[r.id], 0);
  let html = '<tr><th>Catégorie</th><th>Tirages</th><th>Réel</th><th>Cible</th></tr>';
  RARITIES.forEach(r => {
    const real = total ? (stats[r.id] / total * 100).toFixed(0) + ' %' : '-';
    html += '<tr><td>' + r.label + '</td><td>' + stats[r.id] + '</td><td>' + real + '</td><td>' + r.weight + ' %</td></tr>';
  });
  html += '<tr><th>TOTAL</th><th>' + total + '</th><th></th><th></th></tr>';
  if (CONFIG.FORCE_RARITY) html += '<tr><td colspan="4" style="color:#ffc02e">Mode test : rareté forcée (' + CONFIG.FORCE_RARITY + ')</td></tr>';
  html += '<tr><td colspan="4">Image bouton (' + CONFIG.REPLAY_IMG + ') : ' + buttonImgStatus + '</td></tr>';
  $('statsTable').innerHTML = html;
  $('adminReset').textContent = 'Remise à zéro';
  $('admin').classList.add('open');
}
$('adminClose').addEventListener('click', () => $('admin').classList.remove('open'));
let resetArmed = false;   // remise à zéro : deux appuis
$('adminReset').addEventListener('click', e => {
  if (!resetArmed) {
    resetArmed = true; e.target.textContent = 'Confirmer ?';
    setTimeout(() => { resetArmed = false; e.target.textContent = 'Remise à zéro'; }, 3000);
  } else {
    RARITIES.forEach(r => stats[r.id] = 0); saveStats(); resetArmed = false; openAdmin();
  }
});

/* =====================================================================
   DEMARRAGE
   ===================================================================== */
// Précharge tout une fois (remplit aussi le cache hors-ligne du service worker)
const warm = new Set([CONFIG.WAITING_VIDEO, CONFIG.REPLAY_IMG]);
Object.values(STEP_PLAN).forEach(p => p.forEach((prefix, i) => {
  warm.add(CONFIG.CLIP_DIR + prefix + '_STEP_' + (i + 1) + '.mp4');
  warm.add(CONFIG.CLIP_DIR + prefix + '_STEP_' + (i + 1) + '_LOOP.mp4');
}));
// Téléchargement un par un, après 5 s, pour ne pas ralentir les premières vidéos
(async () => {
  await new Promise(r => setTimeout(r, 5000));
  for (const u of warm) { try { const r = await fetch(u); if (r.ok) await r.blob(); } catch (e) {} }
})();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Bouton personnalisé : si assets/button.png existe, il remplace le style CSS
let buttonImgStatus = 'en cours';
replayImg.onload = () => { replayBtn.classList.add('img'); buttonImgStatus = 'chargée (' + replayImg.naturalWidth + 'x' + replayImg.naturalHeight + ')'; };
replayImg.onerror = () => { buttonImgStatus = 'INTROUVABLE'; };
replayImg.src = CONFIG.REPLAY_IMG;
resetGame();
</script>
</body>
</html>
